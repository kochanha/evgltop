[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evgltop"
version = "0.1.0"
description = "Interactive GPU monitoring TUI for SLURM clusters"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Emory Vision & Graphics Lab" },
]
keywords = ["gpu", "monitor", "slurm", "nvidia", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "textual>=0.40",
    "rich>=13.0",
]

[project.scripts]
evgltop = "evgltop.app:main"

[project.urls]
Homepage = "https://github.com/kochanha/evgltop"
Repository = "https://github.com/kochanha/evgltop"
Issues = "https://github.com/kochanha/evgltop/issues"
